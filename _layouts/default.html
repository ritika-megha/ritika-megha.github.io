<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f4f3ee">
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Ritika Megha, home">ritika<span>megha</span><span class="wordmark-star" aria-hidden="true">✳</span></a>
    <nav aria-label="Main navigation">
      <a class="nav-work" href="{{ '/' | relative_url }}" {% if page.body_class == 'portfolio' %}aria-current="page"{% endif %}>Selected work<span class="nav-dot" aria-hidden="true"></span></a>
      <button type="button" data-dialog="about-dialog">About</button>
      {% if page.body_class == 'portfolio' %}<button type="button" data-dialog="index-dialog">Index <span aria-hidden="true">↗</span></button>{% endif %}
      <label class="theme-control"><span class="sr-only">Color theme</span><select data-theme-picker aria-label="Color theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </nav>
  </header>
  {{ content }}
  <dialog id="about-dialog" class="about-dialog">
    <div class="dialog-heading"><span class="eyebrow">A little about me</span><button class="close-dialog" type="button" aria-label="Close about">Close ×</button></div>
    <p class="about-name">Ritika<br><em>Megha.</em></p>
    <p class="about-description">{{ site.about | escape }}</p>
    {% include social-links.html %}
  </dialog>
</body>
</html>
